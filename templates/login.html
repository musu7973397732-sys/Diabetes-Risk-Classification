{% extends "base.html" %}

{% block title %}Login - Diabetes Risk Classification System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="custom-card shadow-sm p-4">
            
            <div class="text-center mb-4">
                <div class="stat-icon stat-icon-blue mx-auto mb-2">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>
                <h2 class="card-title">Login</h2>
                <p class="card-subtitle">Sign in to your account</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                
                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" 
                           name="email" 
                           id="email" 
                           class="form-control" 
                           placeholder="Enter your email" 
                           required 
                           autocomplete="email">
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" 
                           name="password" 
                           id="password" 
                           class="form-control" 
                           placeholder="Enter your password" 
                           required 
                           autocomplete="current-password">
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top text-muted small">
                Don't have an account? 
                <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
