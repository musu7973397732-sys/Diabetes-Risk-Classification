{% extends "base.html" %}

{% block title %}Register - Diabetes Risk Classification System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="custom-card shadow-sm p-4">
            
            <div class="text-center mb-4">
                <div class="stat-icon stat-icon-blue mx-auto mb-2">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h2 class="card-title">Register</h2>
                <p class="card-subtitle">Create an account to start checking diabetes risk</p>
            </div>

            <!-- Client-side Error Feedback -->
            <div id="passwordMismatchMsg" class="alert alert-danger py-2 small d-none" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Passwords do not match.
            </div>

            <form method="POST" action="{{ url_for('register') }}" id="registerForm">
                
                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" 
                           name="name" 
                           id="name" 
                           class="form-control" 
                           placeholder="Enter your full name" 
                           maxlength="100" 
                           required 
                           autocomplete="name">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" 
                           name="email" 
                           id="email" 
                           class="form-control" 
                           placeholder="Enter your email" 
                           maxlength="150" 
                           required 
                           autocomplete="email">
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" 
                           name="password" 
                           id="password" 
                           class="form-control" 
                           placeholder="Create a password (min. 8 characters)" 
                           minlength="8" 
                           required 
                           autocomplete="new-password">
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" 
                           name="confirm_password" 
                           id="confirm_password" 
                           class="form-control" 
                           placeholder="Confirm your password" 
                           minlength="8" 
                           required 
                           autocomplete="new-password">
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-person-check me-1"></i> Register
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top text-muted small">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login here</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
